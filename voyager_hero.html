<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOYAGER // To The Moon! 🚀</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #070b19;
      color: #fff;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hero-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      padding: 1.5rem;
      text-align: center;
    }
    .interactive {
      pointer-events: auto;
    }
    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(6,10,25,0.7) 0%, rgba(6,10,25,0) 100%);
      border-bottom: 1px solid rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(8px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 1.1rem;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      letter-spacing: 2px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 9999px;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      color: #70f3ff;
      font-family: monospace;
      letter-spacing: 1px;
      margin-bottom: 1.5rem;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1.pixel-headline {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(2rem, 6vw, 4.8rem);
      font-weight: 900;
      color: #ffffff;
      text-shadow: 
        4px 4px 0px #ff007f,
        8px 8px 0px #7928ca,
        0 0 30px rgba(255, 0, 127, 0.5);
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    p.subtitle {
      max-width: 620px;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 2.2rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* --- Sci-Fi Cyberpunk HUD Button (Style 1: Diagonal Chamfer) --- */
    .hud-button-wrap {
      position: relative;
      display: inline-block;
    }
    .hud-glow {
      position: absolute;
      inset: -4px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.45) 0%, rgba(255, 0, 127, 0.25) 50%, transparent 75%);
      opacity: 0.35;
      filter: blur(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 0;
      pointer-events: none;
    }
    .hud-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1.1rem 2.5rem;
      background: rgba(10, 25, 45, 0.85);
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.95rem;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      clip-path: polygon(
        14px 0%,
        100% 0%,
        100% calc(100% - 14px),
        calc(100% - 14px) 100%,
        0% 100%,
        0% 14px
      );
    }
    .hud-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.9), rgba(255, 0, 127, 0.8));
      z-index: -2;
    }
    .hud-button::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: #060e22;
      z-index: -1;
      clip-path: polygon(
        13px 0%,
        100% 0%,
        100% calc(100% - 13px),
        calc(100% - 13px) 100%,
        0% 100%,
        0% 13px
      );
      transition: background 0.2s ease;
    }
    .hud-button:hover {
      transform: scale(1.03);
      color: #00f0ff;
      text-shadow: 0 0 12px #00f0ff;
    }
    .hud-button-wrap:hover .hud-glow {
      opacity: 0.85;
      transform: scale(1.08);
    }
    .hud-button:hover::after {
      background: #091738;
    }
    .hud-button:active {
      transform: scale(0.96);
    }

    /* 2x2 Corner Dots Matrix */
    .corner-dots {
      position: absolute;
      top: 8px;
      right: 12px;
      display: grid;
      grid-template-columns: repeat(2, 4px);
      gap: 4px;
      pointer-events: none;
      z-index: 2;
    }
    .corner-dots span {
      width: 4px;
      height: 4px;
      background: #00f0ff;
      opacity: 0.75;
      box-shadow: 0 0 6px #00f0ff;
    }
    /* Side Indicator Dots */
    .side-dots {
      position: absolute;
      left: 7px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
      z-index: 2;
    }
    .side-dots span {
      width: 3px;
      height: 3px;
      background: #00ff88;
      box-shadow: 0 0 5px #00ff88;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(10, 20, 40, 0.95);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      padding: 1rem 2rem;
      border-radius: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.8rem;
      color: #00ff88;
      z-index: 100;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <nav class="interactive">
    <div class="brand">
      <span>🚀</span>
      <span>VOYAGER</span>
    </div>
    <div style="font-size: 0.8rem; color: #94a3b8; font-family: monospace;">
      SYSTEM: <span style="color: #00ff88;">ONLINE</span>
    </div>
  </nav>

  <div class="hero-content">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span>SECTOR 07 // WARP VELOCITY</span>
    </div>

    <h1 class="pixel-headline">To the Moon!</h1>

    <p class="subtitle">
      Embark on a new cosmic journey. Explore your galaxy of quests, defeat procrastination,
      and claim your stake in the pixelated productivity universe.
    </p>

    <div class="hud-button-wrap interactive">
      <div class="hud-glow"></div>
      <button class="hud-button" id="launchBtn" onclick="triggerLaunch()">
        <div class="corner-dots">
          <span></span><span></span>
          <span></span><span></span>
        </div>
        <div class="side-dots">
          <span></span><span></span>
        </div>
        <span>🚀</span>
        <span>LAUNCH MISSION</span>
      </button>
    </div>
  </div>

  <div id="toast">
    <span>✨</span>
    <span>MISSION TRAJECTORY ENGAGED // +25 XP</span>
  </div>

  <script>
    // --- Three.js Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070b19, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 24;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const mouse = new THREE.Vector2(0, 0);
    const clock = new THREE.Clock();

    // Lighting
    const ambLight = new THREE.AmbientLight(0x223366, 1.8);
    scene.add(ambLight);
    const dirLight = new THREE.DirectionalLight(0x00f0ff, 2.2);
    dirLight.position.set(5, 10, 15);
    scene.add(dirLight);

    // --- Starfield ---
    const starCount = 1800;
    const starGeometry = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starColors = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 120;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 120;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 120;

      const c = new THREE.Color();
      const r = Math.random();
      if (r > 0.75) c.setHSL(0.85, 0.9, 0.75); // magenta
      else if (r > 0.45) c.setHSL(0.52, 0.9, 0.75); // cyan
      else c.setHSL(0.6, 0.1, 0.9); // silver
      starColors[i * 3] = c.r;
      starColors[i * 3 + 1] = c.g;
      starColors[i * 3 + 2] = c.b;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
    const starMaterial = new THREE.PointsMaterial({
      size: 0.18,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // --- Pixel Rocket Model ---
    const rocket = new THREE.Group();
    const pixelSize = 0.22;
    const pixelGeo = new THREE.BoxGeometry(pixelSize, pixelSize, pixelSize);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00d4ff, roughness: 0.3, metalness: 0.2, flatShading: true });
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xff007f, roughness: 0.4, flatShading: true });
    const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, emissive: 0x00f0ff, emissiveIntensity: 0.9, flatShading: true });

    // Body
    for (let y = -4; y < 5; y++) {
      for (let x = -2; x < 3; x++) {
        if (Math.abs(x) === 2 && y > 1) continue;
        const pixel = new THREE.Mesh(pixelGeo, bodyMat);
        pixel.position.set(x * pixelSize, y * pixelSize, 0);
        rocket.add(pixel);
      }
    }
    // Wings
    for (let y = -3; y < -1; y++) {
      for (let x = -4; x < -2; x++) {
        const pixelL = new THREE.Mesh(pixelGeo, wingMat);
        pixelL.position.set(x * pixelSize, y * pixelSize, 0);
        rocket.add(pixelL);
        const pixelR = new THREE.Mesh(pixelGeo, wingMat);
        pixelR.position.set(-x * pixelSize, y * pixelSize, 0);
        rocket.add(pixelR);
      }
    }
    // Cockpit
    const cockpit = new THREE.Mesh(pixelGeo, cockpitMat);
    cockpit.position.set(0, 3 * pixelSize, pixelSize * 0.8);
    rocket.add(cockpit);
    scene.add(rocket);

    // --- Rocket Trail (Particle Pool) ---
    const trailPool = [];
    let trailIndex = 0;
    const trailSize = 140;
    const trailGeo = new THREE.BoxGeometry(pixelSize * 1.3, pixelSize * 1.3, pixelSize * 1.3);
    for (let i = 0; i < trailSize; i++) {
      const trailMat = new THREE.MeshBasicMaterial({
        color: Math.random() > 0.5 ? 0xff007f : 0x00f0ff,
        transparent: true,
        opacity: 0.9
      });
      const p = new THREE.Mesh(trailGeo, trailMat);
      p.visible = false;
      scene.add(p);
      trailPool.push(p);
    }

    // --- Floating Crypto / Pixel Coins ---
    const coinGroup = new THREE.Group();
    const coinMat = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      emissive: 0xff9900,
      emissiveIntensity: 0.4,
      metalness: 0.8,
      roughness: 0.2,
      flatShading: true
    });
    for (let i = 0; i < 20; i++) {
      const coin = new THREE.Group();
      for (let p = 0; p < 12; p++) {
        const pixel = new THREE.Mesh(pixelGeo, coinMat);
        const angle = (p / 12) * Math.PI * 2;
        pixel.position.set(Math.cos(angle) * 0.45, Math.sin(angle) * 0.45, 0);
        coin.add(pixel);
      }
      coin.position.set(
        (Math.random() - 0.5) * 44,
        (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 20
      );
      coinGroup.add(coin);
    }
    scene.add(coinGroup);

    // Mouse Listeners
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    let isLaunching = false;
    let launchTime = 0;

    function triggerLaunch() {
      if (isLaunching) return;
      isLaunching = true;
      launchTime = clock.getElapsedTime();

      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3200);

      setTimeout(() => {
        isLaunching = false;
      }, 1600);
    }

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (!isLaunching) {
        const targetPos = new THREE.Vector3(mouse.x * 14, mouse.y * 9, 0);
        rocket.position.lerp(targetPos, 0.05);
        rocket.rotation.y = (targetPos.x - rocket.position.x) * 0.12;
        rocket.rotation.x = -(targetPos.y - rocket.position.y) * 0.12;
        rocket.rotation.z = Math.sin(elapsed * 2.5) * 0.05;
      } else {
        // Warp jump trajectory
        rocket.position.y += delta * 45;
        rocket.position.x += Math.sin(elapsed * 20) * 0.2;
        rocket.rotation.x = -0.5;
        if (rocket.position.y > 35) {
          rocket.position.y = -35;
        }
      }

      // Emit trail
      if (Math.random() > 0.2) {
        const p = trailPool[trailIndex];
        p.position.copy(rocket.position);
        p.position.y -= 0.85;
        p.position.x += (Math.random() - 0.5) * 0.25;
        p.scale.setScalar(1);
        p.visible = true;
        p.userData.life = 1.0;
        trailIndex = (trailIndex + 1) % trailSize;
      }

      // Update trail
      trailPool.forEach((p) => {
        if (p.visible) {
          p.userData.life -= delta * 1.8;
          p.position.y -= delta * 4.0;
          p.scale.setScalar(Math.max(0, p.userData.life));
          if (p.userData.life <= 0) p.visible = false;
        }
      });

      // Update coins
      coinGroup.children.forEach((coin, i) => {
        coin.rotation.y = elapsed * (i % 2 === 0 ? 1.6 : -1.6);
        coin.position.y += Math.sin(elapsed * 2 + i) * 0.008;
      });

      // Slowly rotate starfield
      stars.rotation.y = elapsed * 0.02;
      stars.rotation.x = elapsed * 0.01;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
